version: 2

models:
  - name: dim_movie
    columns:
      - name: movie_key
        tests:
          - unique
          - not_null
      - name: title
        tests:
          - not_null
      - name: release_year
        tests:
          - not_null

  - name: dim_distributor
    columns:
      - name: distributor_key
        tests:
          - unique
          - not_null
      - name: distributor_name
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_key
        tests:
          - unique
          - not_null
      - name: date
        tests:
          - unique
          - not_null

  - name: movie_genre
    columns:
      - name: movie_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_movie')
                field: movie_key
      - name: genre
        tests:
          - not_null

  - name: fact_movie_performance
    columns:
      - name: movie_key
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_movie')
                field: movie_key
      - name: distributor_key
        tests:
          - relationships:
              arguments:
                to: ref('dim_distributor')
                field: distributor_key
      - name: release_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: total_gross
        tests:
          - not_null
      - name: opening_theaters
        tests:
          - not_null:
              config:
                severity: warn
